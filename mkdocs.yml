# Solarbio Technical Documentation — V12 Enterprise Knowledge Authority Engine
site_name: Solarbio Technical Documentation
site_description: Official technical documentation, product specifications, protocols, and quality standards for Solarbio life science research products.
site_url: https://data.solarbio.store
repo_url: https://github.com/solarbio/solarbio-docs
repo_name: solarbio/solarbio-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en

  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - toc.follow

plugins:
  - search


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra:
  generator: false
  social:
    - icon: fontawesome/solid/shop
      link: https://solarbio.store
      name: Solarbio Store
    - icon: fontawesome/brands/github
      link: https://github.com/solarbio/solarbio-docs
      name: Documentation Repository

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: |
  &copy; 2004–2026 Solarbio. All rights reserved.

